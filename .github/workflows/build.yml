name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      ORCA_VERSION: "v1.4.252"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: ORCA_VERSION=${{ env.ORCA_VERSION }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orca:${{ env.ORCA_VERSION }}
            ghcr.io/${{ github.repository_owner }}/orca:latest
